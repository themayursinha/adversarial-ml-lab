name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: |
          python -m ruff check src tests app.py

      - name: Type check with mypy
        run: |
          python -m mypy src app.py --ignore-missing-imports

      - name: Run tests
        run: |
          python -m pytest -q

  package-smoke:
    runs-on: ubuntu-24.04
    needs: [quality]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          python -m build --no-isolation
          python -m twine check dist/*

      - name: Smoke test installed CLI in isolated venv
        run: |
          python -m venv /tmp/adml-smoke
          /tmp/adml-smoke/bin/python -m pip install --upgrade pip
          /tmp/adml-smoke/bin/pip install dist/*.whl
          /tmp/adml-smoke/bin/adml --help
          /tmp/adml-smoke/bin/adml eval --suite baseline

  container-smoke:
    runs-on: ubuntu-24.04
    needs: [quality]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Build hardened runtime image
        run: |
          docker build --pull --tag adml-smoke:${{ github.sha }} .

      - name: Smoke test CLI help in locked-down container
        run: |
          docker run --rm \
            --network none \
            --read-only \
            --tmpfs /tmp \
            --tmpfs /home/nonroot/.cache \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            -e PYTHONDONTWRITEBYTECODE=1 \
            --entrypoint python \
            adml-smoke:${{ github.sha }} \
            -m src.cli --help

      - name: Smoke test scan command in locked-down container
        run: |
          printf '%s\n' 'Quarterly report highlights and normal business metrics.' | docker run --rm -i \
            --network none \
            --read-only \
            --tmpfs /tmp \
            --tmpfs /home/nonroot/.cache \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            -e PYTHONDONTWRITEBYTECODE=1 \
            --entrypoint python \
            adml-smoke:${{ github.sha }} \
            -m src.cli scan --task summarize

  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Security scan with Bandit
        run: |
          python -m bandit -r src -ll

      - name: Dependency audit
        run: |
          python -m pip_audit -r requirements.txt

  sbom:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Generate CycloneDX SBOM
        run: |
          cyclonedx-py requirements requirements.txt --output-file sbom.json --output-format json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.4
        with:
          name: cyclonedx-sbom
          path: sbom.json
