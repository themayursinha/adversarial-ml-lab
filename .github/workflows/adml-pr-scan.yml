name: Adversarial ML PR Scan

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          fetch-depth: 0

      - name: Run adversarial ML scan
        uses: ./.github/actions/adml-scan
        with:
          task: "summarize"
          fail-on-critical: "true"
          max-files: "20"
