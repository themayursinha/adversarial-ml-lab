name: Adversarial ML PR Scan

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0

      - name: Run adversarial ML scan
        uses: ./.github/actions/adml-scan
        with:
          task: "summarize"
          fail-on-critical: "true"
          max-files: "20"
