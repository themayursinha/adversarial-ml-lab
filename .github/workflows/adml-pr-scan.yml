name: Adversarial ML PR Scan

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - name: Run adversarial ML scan
        uses: ./.github/actions/adml-scan
        with:
          task: "summarize"
          fail-on-critical: "true"
          max-files: "20"
