name: Adversarial ML PR Scan

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Run adversarial ML scan
        uses: ./.github/actions/adml-scan
        with:
          task: "summarize"
          fail-on-critical: "true"
          max-files: "20"
