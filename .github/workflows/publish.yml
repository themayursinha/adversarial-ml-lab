name: Publish Package

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    name: Build distributions
    runs-on: ubuntu-latest
    outputs:
      package_version: ${{ steps.package-meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip
          pip install build twine
          python -m build
          python -m twine check dist/*

      - name: Capture package version
        id: package-meta
        run: |
          VERSION="$(python - <<'PY'
          import tomllib

          with open("pyproject.toml", "rb") as f:
              print(tomllib.load(f)["project"]["version"])
          PY
          )"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*
          if-no-files-found: error

  publish-testpypi:
    name: Publish to TestPyPI
    needs: [build]
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v7
        with:
          name: python-dist
          path: dist

      - name: Publish package to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist
          skip-existing: true

  smoke-test-testpypi:
    name: Smoke test TestPyPI install
    needs: [build, publish-testpypi]
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tagged package from TestPyPI and run CLI help
        env:
          PACKAGE_VERSION: ${{ needs.build.outputs.package_version }}
        run: |
          python -m venv /tmp/adml-testpypi
          /tmp/adml-testpypi/bin/python -m pip install --upgrade pip
          for attempt in 1 2 3 4 5 6 7 8; do
            /tmp/adml-testpypi/bin/pip install \
              --index-url https://test.pypi.org/simple/ \
              --extra-index-url https://pypi.org/simple \
              "adversarial-ml-lab==${PACKAGE_VERSION}" && break
            if [ "${attempt}" -eq 8 ]; then
              echo "Package adversarial-ml-lab==${PACKAGE_VERSION} not available on TestPyPI in time." >&2
              exit 1
            fi
            sleep 15
          done
          /tmp/adml-testpypi/bin/adml --help

  publish-pypi:
    name: Publish to PyPI
    needs: [smoke-test-testpypi]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v7
        with:
          name: python-dist
          path: dist

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true
