name: Supply Chain Audit

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Audit Python dependencies
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

      - name: Verify Python hash pinning
        run: grep -q -- '--hash=sha256' requirements-hashed.txt

      - name: Verify Docker digest pinning
        run: grep '^FROM ' Dockerfile | grep -q '@sha256:'

      - name: Verify GitHub Actions SHA pinning
        run: |
          ! grep -rE 'uses:\s+[^@]+@v[0-9]' .github/workflows/

      - name: Secrets scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0