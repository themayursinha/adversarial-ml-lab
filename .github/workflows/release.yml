name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  packages: write
  attestations: write

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install sigstore

      - name: Run quality gates
        run: |
          python -m ruff check src tests app.py
          python -m mypy src app.py --ignore-missing-imports
          python -m pytest -q

      - name: Build package artifacts
        run: |
          python -m build --no-isolation
          python -m twine check dist/*

      - name: Sign artifacts with Sigstore
        run: |
          for artifact in dist/*.whl dist/*.tar.gz; do
            [ -f "$artifact" ] && python -m sigstore sign --bundle "${artifact}.sigstore.json" "$artifact"
          done

      - name: Build and push Docker image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          IMAGE=ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          IMAGE_LATEST=ghcr.io/${{ github.repository }}:latest
          docker buildx build \
            --provenance=true \
            --sbom=true \
            --push \
            --tag "$IMAGE" \
            --tag "$IMAGE_LATEST" \
            .

      - name: Smoke test CLI help in locked-down container
        run: |
          docker run --rm \
            --network none \
            --read-only \
            --tmpfs /tmp \
            --tmpfs /home/nonroot/.cache \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            -e PYTHONDONTWRITEBYTECODE=1 \
            --entrypoint python \
            ghcr.io/${{ github.repository }}:${{ github.ref_name }} \
            -m src.cli --help

      - name: Smoke test scan command in locked-down container
        run: |
          printf '%s\n' 'Quarterly report highlights and normal business metrics.' | docker run --rm -i \
            --network none \
            --read-only \
            --tmpfs /tmp \
            --tmpfs /home/nonroot/.cache \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            -e PYTHONDONTWRITEBYTECODE=1 \
            --entrypoint python \
            ghcr.io/${{ github.repository }}:${{ github.ref_name }} \
            -m src.cli scan --task summarize

      - name: Smoke test installed CLI in isolated venv
        run: |
          python -m venv /tmp/adml-release-smoke
          /tmp/adml-release-smoke/bin/python -m pip install --upgrade pip
          /tmp/adml-release-smoke/bin/pip install dist/*.whl
          /tmp/adml-release-smoke/bin/adml --help
          /tmp/adml-release-smoke/bin/adml eval --suite baseline

      - name: Generate CycloneDX SBOM
        run: |
          cyclonedx-py requirements requirements.txt --output-file sbom.json --output-format json

      - name: Sign SBOM
        run: |
          python -m sigstore sign --bundle sbom.json.sigstore.json sbom.json

      - name: Create release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda  # v3.0.0
        with:
          files: |
            dist/*
            dist/*.sigstore.json
            sbom.json
            sbom.json.sigstore.json
          generate_release_notes: true
