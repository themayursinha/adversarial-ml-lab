version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      # hydra-core 1.3.4 requires antlr4-python3-runtime==4.9.*;
      # isolated antlr4 4.13+ bumps always fail container-smoke.
      - dependency-name: "antlr4-python3-runtime"
        versions: [">=4.10"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
