name: "Adversarial ML Scan"
description: "Scan changed files in a PR for prompt injection, context tampering, and inference evasion patterns"

inputs:
  task:
    description: "Task type for scan (summarize, classify, chat, qa, general)"
    required: false
    default: "summarize"
  fail-on-critical:
    description: "Fail the workflow if critical risk is detected"
    required: false
    default: "true"
  max-files:
    description: "Maximum number of changed files to scan"
    required: false
    default: "20"

outputs:
  risk-level:
    description: "Highest risk level found across all scans"
    value: ${{ steps.scan.outputs.risk_level }}
  findings-count:
    description: "Total number of findings"
    value: ${{ steps.scan.outputs.findings_count }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
      with:
        python-version: "3.12"

    - name: Install adml
      shell: bash
      run: |
        pip install -e .

    - name: Get changed files
      id: changed
      shell: bash
      run: |
        FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }} \
          -- '*.md' '*.txt' '*.py' '*.json' '*.yaml' '*.yml' 'Dockerfile' 'Dockerfile.*' \
          | grep -v 'test_' | grep -v '__pycache__' | head -n ${{ inputs.max-files }} || true)
        echo "count=$(echo "$FILES" | wc -l)" >> $GITHUB_OUTPUT
        echo "files<<EOF" >> $GITHUB_OUTPUT
        echo "$FILES" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: Run adml scan on changed files
      id: scan
      shell: bash
      run: |
        echo "Scanning ${{ steps.changed.outputs.count }} changed files..."

        HIGHEST_RISK="low"
        TOTAL_FINDINGS=0
        SUMMARY=""

        while IFS= read -r file; do
          [ -z "$file" ] && continue
          [ ! -f "$file" ] && continue

          RESULT=$(adml scan --file "$file" --task "${{ inputs.task }}" 2>/dev/null || echo '{"risk_level":"error"}')
          RISK=$(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin).get('risk_level','error'))" 2>/dev/null || echo "error")
          BLOCKED=$(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin).get('blocked','false'))" 2>/dev/null || echo "false")

          case $RISK in
            critical|high|medium|low)
              if [ "$RISK" = "critical" ] || { [ "$RISK" = "high" ] && [ "$HIGHEST_RISK" != "critical" ]; }; then
                HIGHEST_RISK="$RISK"
              elif [ "$RISK" = "medium" ] && [ "$HIGHEST_RISK" != "critical" ] && [ "$HIGHEST_RISK" != "high" ]; then
                HIGHEST_RISK="$RISK"
              fi
              ;;
          esac

          if [ "$BLOCKED" = "true" ] || [ "$RISK" = "high" ] || [ "$RISK" = "critical" ]; then
            SHORT=$(echo "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); det=d.get('detections',[]); print(d['risk_level'].upper() + (' — ' + det[0]['description'] if det else ''))" 2>/dev/null || echo "detection")
            SUMMARY="${SUMMARY}\n- **\`$file\`**: ${SHORT}"
            TOTAL_FINDINGS=$((TOTAL_FINDINGS + 1))
          fi
        done <<< "${{ steps.changed.outputs.files }}"

        echo "risk_level=$HIGHEST_RISK" >> $GITHUB_OUTPUT
        echo "findings_count=$TOTAL_FINDINGS" >> $GITHUB_OUTPUT
        echo "summary<<EOF" >> $GITHUB_OUTPUT
        echo -e "$SUMMARY" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: Post PR comment
      if: steps.scan.outputs.findings_count > 0
      uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea  # v7.0.1
      with:
        script: |
          const summary = `## Adversarial ML Scan Results
          **Risk Level:** \`${{ steps.scan.outputs.risk_level }}\`
          **Findings:** ${{ steps.scan.outputs.findings_count }}
          ${{ steps.scan.outputs.summary }}
          > Run \`adml scan --file <path>\` locally to investigate.
          `;
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: summary
          });

    - name: Fail on critical
      if: inputs.fail-on-critical == 'true' && steps.scan.outputs.risk_level == 'critical'
      shell: bash
      run: |
        echo "CRITICAL risk detected. Failing the check."
        exit 1
