# @package _global_

llm:
  default_mode: simulation
  simulation:
    model: simulation-v1
    temperature: 0.0
    max_tokens: 4096
    timeout: 10.0
    max_retries: 0
  openai:
    model: gpt-4o-mini
    temperature: 0.1
    max_tokens: 2048
    timeout: 60.0
    max_retries: 2
  anthropic:
    model: claude-3-haiku-20240307
    temperature: 0.1
    max_tokens: 2048
    timeout: 60.0
    max_retries: 2
  ollama:
    model: llama3.2
    temperature: 0.1
    max_tokens: 2048
    timeout: 120.0

defense:
  context_filter:
    sensitivity: 0.7
    block_on_detection: true
  isolation:
    level: session
    redaction_level: basic
    max_session_age_minutes: 30
    max_context_length: 50
  anomaly_scorer:
    entropy_threshold: 4.2
    symbol_density_threshold: 0.25
    unicode_ratio_threshold: 0.15
    repetition_threshold: 0.3
    trigram_perplexity_threshold: 400.0
    anomaly_threshold: 0.6

uncertainty:
  human_review_threshold: 0.5
  aggregation: weighted_mean

eval:
  default_suite: baseline
  max_concurrency: 10
  simulate_vulnerable: true

scan:
  default_task: summarize
  simulate_vulnerable: false
