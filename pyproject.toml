[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adversarial-ml-lab"
dynamic = ["version"]
description = "Adversarial LLM attack-and-defense lab for security engineers"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "anthropic>=0.30.0",
    "bleach>=6.0.0",
    "chromadb>=1.5.0",
    "gradio>=4.0.0",
    "httpx>=0.27.0",
    "hydra-core>=1.3.0",
    "matplotlib>=3.7.0",
    "numpy>=1.24.0",
    "omegaconf>=2.3.0",
    "openai>=1.0.0",
    "pandas>=2.0.0",
    "plotly>=5.18.0",
    "regex>=2023.0.0",
    "structlog>=24.0.0",
    "wandb>=0.16.0",
]
authors = [
    {name = "Mayur"}
]
keywords = [
    "adversarial-ml",
    "llm-security",
    "prompt-injection",
    "machine-learning",
    "ai-safety"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]

[project.scripts]
adml = "src.cli:main"

[project.urls]
Homepage = "https://github.com/themayursinha/adversarial-ml-lab"
Documentation = "https://github.com/themayursinha/adversarial-ml-lab#readme"
Repository = "https://github.com/themayursinha/adversarial-ml-lab"
Issues = "https://github.com/themayursinha/adversarial-ml-lab/issues"
Security = "https://github.com/themayursinha/adversarial-ml-lab/security/policy"

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]

[tool.setuptools.dynamic]
version = {attr = "src.__version__"}

[tool.setuptools.package-data]
"src.resources" = ["datasets/*.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
