version: "3.8"

services:
  api:
    build: .
    image: adversarial-ml-lab:latest
    container_name: adml-api
    ports:
      - "7861:7861"
    environment:
      - GRADIO_SERVER_NAME=0.0.0.0
      - GRADIO_SERVER_PORT=7861
      - PYTHONUNBUFFERED=1
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OLLAMA_HOST=${OLLAMA_HOST:-}
      - WANDB_API_KEY=${WANDB_API_KEY:-}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    entrypoint: ["python", "-m", "src.cli"]
    command: ["api", "--host", "0.0.0.0", "--port", "7861"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7861/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /home/nonroot/.cache
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - adml-net

  ollama:
    image: ollama/ollama:latest
    container_name: adml-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_HOST=0.0.0.0
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - adml-net
    profiles:
      - llm
      - full

volumes:
  ollama-data:

networks:
  adml-net:
    driver: bridge
